# Render Blueprint (#28, ADR-0006). Applying it in the Render dashboard (New → Blueprint) creates
# BILLABLE resources in the owner's account: web 0.5c-512mb ($7/month) + Render Postgres 0.1c-256mb
# ($6/month) + 1 GB storage ($0.30/GB/month) ≈ $13.30/month, prorated. Applying it is an owner
# spending decision (AGENTS.md §9). Details, rollback and verification: docs/deploy/render.md.
#
# Secrets are never in this file: `sync: false` values are entered in Render's form when the
# Blueprint is applied (or set later via the dashboard/API), never in Git or chat.
services:
  - type: web
    name: waymark-web
    runtime: node
    plan: 0.5c-512mb # always on, no cold starts; preDeployCommand needs a paid plan
    region: frankfurt # EU, same region as the database (private network); Nebius models run in eu-north1
    # NODE_ENV=production is set below and also applies at build time, so devDependencies (TypeScript,
    # tsx) must be installed explicitly for `next build` and the migration script.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fle/web build
    # Runs after the build, before the new version takes traffic. A failed migration fails the deploy
    # and the previous version keeps serving. Migrations are idempotent and advisory-locked.
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @fle/web start
    healthCheckPath: /api/health
    autoDeployTrigger: "off" # deploys are triggered deliberately (dashboard/API), never by a push
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Durable worlds (#9) on the database below, over Render's private network.
      - key: WORLD_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: waymark-db
          property: connectionString
      # CSRF Origin allowlist (ADR-0011). Unset → the app uses RENDER_EXTERNAL_URL (this service's
      # https://….onrender.com). Set it explicitly only when adding a custom domain.
      # AI tutor (ADR-0007, #6): owner chose gpt-oss-120b on 7 Nov. Model id is configuration.
      - key: AI_PROVIDER
        value: nebius
      - key: NEBIUS_API_BASE
        value: https://api.tokenfactory.nebius.com/v1
      - key: NEBIUS_API_KEY
        sync: false
      - key: AI_MODEL_TUTOR
        value: openai/gpt-oss-120b
      - key: AI_STRUCTURED_OUTPUTS
        value: "true"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "3000"
      # PayPal (SANDBOX only) is deliberately NOT configured yet: no server code uses it until #21/#22
      # land, and unused credentials on a server only widen exposure. They are added then, with
      # PAYPAL_ENV=sandbox and PAYPAL_API_BASE=https://api-m.sandbox.paypal.com; live is never allowed.

databases:
  - name: waymark-db
    plan: 0.1c-256mb # 256 MB RAM, 100 connections, $6/month
    region: frankfurt
    postgresMajorVersion: "17" # the version CI's `postgres` job and the real-server tests use
    diskSizeGB: 1 # the default for this plan is 15 GB (≈ $4.50/month); worlds are tiny. Can grow, never shrink.
    databaseName: waymark
    user: waymark
    ipAllowList: [] # no external connections: only services on Render's private network
