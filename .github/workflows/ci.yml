name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          CI: "true"
      - run: pnpm contracts:check
      - run: pnpm demo

  # Real PostgreSQL (#9): the persistence tests against a real server, with separate connection
  # pools racing for the same row. PGlite (in `verify`) is single-connection and can't show that.
  # The image is pinned by digest (postgres 17.11-alpine, resolved 6 Nov 2026).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/persistence apps/web/test/persistence.test.ts apps/web/test/run-checkout-target.test.ts apps/web/test/run-paypal.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Render's preDeployCommand (#28): a fresh database migrates, a second run is a no-op.
      - name: db:migrate on a fresh database, twice (idempotent)
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE predeploy"
          pnpm db:migrate | tee first.txt
          pnpm db:migrate | tee second.txt
          grep -q "applied" first.txt
          grep -q "up to date" second.txt
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/predeploy

  # Browser E2E (#101): Playwright (Chromium) against a production build of apps/web with an
  # in-memory world store and the deterministic fake tutor. No secrets, no PayPal or Nebius calls,
  # no shared database. Ubuntu only to keep the footprint small (also run locally on Windows).
  # Not a required check until the owner decides. upload-artifact pinned to v7.0.2 (resolved
  # 7 Nov 2026 via the git ref and commits APIs, both cf430e0…).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fle/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Secret scanning (#11). GitHub's own secret scanning and dependency review need paid
  # GitHub Advanced Security on private repos (dependency-graph/compare returns 403 here), so we run
  # gitleaks (MIT) ourselves. The binary is pinned by version AND sha256, both taken from the
  # maintainers' checksums file and GitHub's asset digest, which agreed on 6 Nov 2026.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      - name: Install gitleaks (verified by sha256)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # Scan every commit reachable from the commit under test (the PR merge commit, or main),
      # NOT --all: gitleaks defaults to `git log --all`, and with fetch-depth 0 that included other
      # branches, so one branch's finding failed every PR (#11 follow-up).
      - name: Scan the history of the commit under test
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 --log-opts="--full-history HEAD" .'

  # Dependency audit (#11): the free stand-in for dependency-review. It fails on high or critical
  # advisories in the lockfile.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # setup-node v5 auto-enables pnpm caching (packageManager field). This job never installs,
          # so the store path doesn't exist and the post-job cache save failed the job ("Path
          # Validation Error"), flakily, depending on cache state. Audit reads only the lockfile.
          package-manager-cache: false
      - run: pnpm audit --audit-level high
