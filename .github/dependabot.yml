version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # Project rule: dependency versions must be at least two weeks old.
    cooldown:
      default-days: 14
    ignore:
      # Runtime is Node 24 (engines); keep @types/node on the 24.x line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
